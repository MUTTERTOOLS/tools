<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}} - 投资者教育手册系列</title>
    <style>
        :root {
            --primary-color: #2c5282;
            --secondary-color: #3182ce;
            --accent-color: #e53e3e;
            --bg-color: #f7fafc;
            --text-color: #2d3748;
            --border-color: #e2e8f0;
            --code-bg: #edf2f7;
            --success-color: #38a169;
            --warning-color: #d69e2e;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
            line-height: 1.8;
            color: var(--text-color);
            background: var(--bg-color);
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 40px 20px;
            text-align: center;
            margin-bottom: 40px;
        }
        
        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        header .subtitle {
            font-size: 1.2em;
            opacity: 0.9;
        }
        
        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .nav-tab {
            padding: 12px 24px;
            background: white;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            text-decoration: none;
            color: var(--text-color);
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .nav-tab:hover {
            border-color: var(--secondary-color);
            color: var(--secondary-color);
        }
        
        .nav-tab.active {
            background: var(--secondary-color);
            color: white;
            border-color: var(--secondary-color);
        }
        
        .content-section {
            background: white;
            border-radius: 12px;
            padding: 40px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        
        h2 {
            color: var(--primary-color);
            font-size: 2em;
            margin: 30px 0 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid var(--secondary-color);
        }
        
        h3 {
            color: var(--secondary-color);
            font-size: 1.5em;
            margin: 25px 0 15px;
        }
        
        h4 {
            color: var(--text-color);
            font-size: 1.2em;
            margin: 20px 0 10px;
        }
        
        p {
            margin: 15px 0;
            text-align: justify;
        }
        
        ul, ol {
            margin: 15px 0;
            padding-left: 30px;
        }
        
        li {
            margin: 8px 0;
        }
        
        .info-box {
            background: #ebf8ff;
            border-left: 4px solid var(--secondary-color);
            padding: 20px;
            margin: 20px 0;
            border-radius: 0 8px 8px 0;
        }
        
        .warning-box {
            background: #fffaf0;
            border-left: 4px solid var(--warning-color);
            padding: 20px;
            margin: 20px 0;
            border-radius: 0 8px 8px 0;
        }
        
        .success-box {
            background: #f0fff4;
            border-left: 4px solid var(--success-color);
            padding: 20px;
            margin: 20px 0;
            border-radius: 0 8px 8px 0;
        }
        
        .action-criteria {
            background: #fff5f5;
            border: 2px solid var(--accent-color);
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
        }
        
        .action-criteria h4 {
            color: var(--accent-color);
            margin-top: 0;
        }
        
        pre {
            background: var(--code-bg);
            padding: 20px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 20px 0;
            border: 1px solid var(--border-color);
        }
        
        code {
            font-family: "Courier New", Courier, monospace;
            background: var(--code-bg);
            padding: 2px 6px;
            border-radius: 4px;
        }
        
        pre code {
            background: none;
            padding: 0;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        
        th, td {
            border: 1px solid var(--border-color);
            padding: 12px;
            text-align: left;
        }
        
        th {
            background: var(--primary-color);
            color: white;
        }
        
        tr:nth-child(even) {
            background: var(--bg-color);
        }
        
        .echarts-container {
            width: 100%;
            height: 400px;
            margin: 30px 0;
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }
        
        footer {
            text-align: center;
            padding: 40px 20px;
            color: #718096;
            border-top: 1px solid var(--border-color);
            margin-top: 40px;
        }
        
        @media (max-width: 768px) {
            .content-section {
                padding: 20px;
            }
            
            header h1 {
                font-size: 1.8em;
            }
            
            .nav-tabs {
                justify-content: center;
            }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>
<body>
    <header>
        <h1>{{TITLE}}</h1>
        <div class="subtitle">{{SUBTITLE}}</div>
    </header>
    
    <div class="container">
        <nav class="nav-tabs">
            <a href="../index.html" class="nav-tab">📚 系列首页</a>
            <a href="01-裸 K 与价格行为.html" class="nav-tab">第 1 册 裸 K</a>
            <a href="02-财报与基本面.html" class="nav-tab {{ACTIVE_02}}">第 2 册 财报</a>
            <a href="03-宏观经济分析.html" class="nav-tab {{ACTIVE_03}}">第 3 册 宏观</a>
            <a href="04-交易系统与实战.html" class="nav-tab {{ACTIVE_04}}">第 4 册 交易</a>
            <a href="05-风险管理与交易心理.html" class="nav-tab {{ACTIVE_05}}">第 5 册 风控</a>
        </nav>
        
        <main id="content">
            {{CONTENT}}
        </main>
    </div>
    
    <footer>
        <p>《投资者教育手册系列》（全五册） © 2024</p>
        <p>仅供学习参考，不构成投资建议</p>
    </footer>
    
    <script>
        // ECharts 图表渲染逻辑将在这里动态插入
        {{ECHARTS_SCRIPT}}
    </script>
</body>
</html>
